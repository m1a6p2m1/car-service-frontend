<div class="notification-bell" (click)="toggleDropdown()">
  <div class="bell-icon">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M13.73 21a2 2 0 0 1-3.46 0"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <div class="notification-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? "99+" : unreadCount }}
    </div>
  </div>

  <!-- Dropdown -->
  <div
    class="notification-dropdown"
    *ngIf="showDropdown"
    (click)="$event.stopPropagation()"
  >
    <div class="dropdown-header">
      <h4>Notifications</h4>
      <button
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()"
        class="mark-all-read"
      >
        Mark all as read
      </button>
    </div>

    <div class="notification-list" *ngIf="notifications.length > 0">
      <div
        *ngFor="let notification of notifications.slice(0, 5)"
        class="notification-item"
        [class.unread]="!notification.readStatus"
        (click)="markAsRead(notification.id)"
      >
        <div class="notification-icon" [class]="'icon-' + notification.type">
          <span *ngIf="notification.type === 'success'">✓</span>
          <span *ngIf="notification.type === 'info'">ℹ</span>
          <span *ngIf="notification.type === 'warning'">⚠</span>
          <span *ngIf="notification.type === 'error'">✕</span>
        </div>
        <div class="notification-content">
          <div class="notification-message">{{ notification.message }}</div>
          <div class="notification-time">
            {{ getRelativeTime(notification.timestamp) }}
          </div>
        </div>
        <div class="notification-status" *ngIf="!notification.readStatus"></div>
      </div>
    </div>

    <div *ngIf="notifications.length === 0" class="no-notifications">
      <div class="no-notifications-icon">🔔</div>
      <p>No notifications yet</p>
    </div>

    <!-- <div class="dropdown-footer" *ngIf="notifications.length > 5">
      <button class="view-all-btn">View all notifications</button>
    </div> -->
  </div>
</div>

<!-- Backdrop -->
<div class="backdrop" *ngIf="showDropdown" (click)="closeDropdown()"></div>
<button
  [matMenuTriggerFor]="profile"
  mat-icon-button
  class="m-r-5 p-0 d-flex jc-c align-items-center"
>
  <img
    *ngIf="selectedImageUrl"
    [src]="selectedImageUrl"
    alt="user"
    class="profile-pic"
  /><!--[src]="selectedImageUrl ? selectedImageUrl : 'assets/images/item/men_logo.png'"-->
</button>
<mat-menu #profile="matMenu" class="mymegamenu" style="width: 150px;">
  <!-- <button mat-menu-item><mat-icon>settings</mat-icon> Settings</button> -->
  <button mat-menu-item (click)="openUserProfile()">
    <mat-icon>account_box</mat-icon> Profile</button
  ><!--(click)="openUserProfile()"-->
  <!-- <button mat-menu-item>
    <mat-icon>notifications_off</mat-icon> Disable notifications
  </button> -->
  <button mat-menu-item (click)="logOutUser()">
    <mat-icon>exit_to_app</mat-icon> Sign Out
  </button>
</mat-menu>
