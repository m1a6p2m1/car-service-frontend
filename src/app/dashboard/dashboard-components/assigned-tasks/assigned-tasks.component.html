<mat-card>
    <mat-card-header>
        <mat-card-title>Assigned Tasks</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <ng-container matColumnDef="taskName">
              <th mat-header-cell *matHeaderCellDef>Task Name</th>
              <td mat-cell *matCellDef="let element">{{ element.taskName }}</td>
            </ng-container>

            <ng-container matColumnDef="taskCreatedBy">
                <th mat-header-cell *matHeaderCellDef>Task Created By</th>
                <td mat-cell *matCellDef="let element">{{ element.taskCreatedBy }}</td>
            </ng-container>
      
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Current State</th>
              <td mat-cell *matCellDef="let element">{{ element.status }}</td>
            </ng-container>
      
            <ng-container matColumnDef="customerName">
              <th mat-header-cell *matHeaderCellDef>Customer Name</th>
              <td mat-cell *matCellDef="let element">{{ element.customerName }}</td>
            </ng-container>
      
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
          <mat-paginator
            [pageSizeOptions]="[5, 10, 25, 100]"
            aria-label="Select page of users"
          ></mat-paginator>
    </mat-card-content>
</mat-card>
