<mat-card class="item-card" *ngIf="task">
    <div class="image-section">
        
    </div>
    <div class="details-section" >
    <div class="details">
        <h1><b>{{ task.taskName }}</b></h1>
        <h3>{{task.description}}</h3><br>
        <h5>{{task.shortDescription}}</h5>
        <!-- <h4>RS.{{task.totalTaskPrice}}</h4> -->
    </div>
        <button class="btnBook" (click)="bookAppointment()">Book Now</button>
    </div>
</mat-card>
