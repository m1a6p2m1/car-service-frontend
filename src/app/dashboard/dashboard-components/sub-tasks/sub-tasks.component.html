<div class="tasks-card" *ngFor="let task of tasks">
    <mat-card >
        <div class="p-20 bg-info position-relative">
            <mat-card-title >{{ task.taskName }}</mat-card-title>
        </div>
        <mat-card-content>
          <ul>
            <li>Assign Washing Bay</li>
            <li>Wash the Vehicle</li>
            <li>Complete the Washing</li>
          </ul>
        </mat-card-content>
    </mat-card>
</div>
