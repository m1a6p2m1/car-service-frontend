<div class="forgot-password-container">
      <div class="forgot-password-card">
        <div class="header">
          <div class="logo">
            <img
                src="./assets/images/logo/vehicle-service-logo.jpg"
                class="align-middle m-2"
                alt="logo"
                style="width: 100px; height: 100px; border-radius: 50%"
              />
            <!-- <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 20L15 10H25L35 20L25 30H15L5 20Z" stroke="#f97316" stroke-width="2" fill="none"/>
              <circle cx="20" cy="20" r="8" stroke="#f97316" stroke-width="2" fill="none"/>
            </svg> -->
          </div>
          <h1>Namal Vehicle Service</h1>
          <p>Reset your password</p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              [class.error]="isFieldInvalid('email')"
              placeholder="Enter your email address"
            />
            <div *ngIf="isFieldInvalid('email')" class="error-message">
              <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">
                Email is required
              </span>
              <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">
                Please enter a valid email address
              </span>
            </div>
          </div>

          <button 
            type="submit" 
            [disabled]="isLoading || forgotPasswordForm.invalid"
            class="submit-btn"
          >
            <span *ngIf="!isLoading">Send Reset Link</span>
            <span *ngIf="isLoading" class="loading">
              <svg class="spinner" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="50" stroke-dashoffset="50">
                  <animate attributeName="stroke-dashoffset" values="50;0" dur="1s" repeatCount="indefinite"/>
                </circle>
              </svg>
              Sending...
            </span>
          </button>
        </form>

        <div *ngIf="successMessage" class="success-message">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="10" fill="#10b981"/>
            <path d="M6 10l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>{{ successMessage }}</span>
        </div>

        <div *ngIf="errorMessage" class="error-message-box">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="10" fill="#ef4444"/>
            <path d="M8 8l4 4M12 8l-4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="footer">
          <p>Remember your password? <a href="#" [routerLink]="'/authentication/login'">Back to Login</a></p>
        </div>
      </div>
    </div>
