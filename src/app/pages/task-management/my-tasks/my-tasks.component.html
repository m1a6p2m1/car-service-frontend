<div class="table-section">
    <div class="refresh-button-filter-section">
      <div class="refresh-button">
        <button mat-icon-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" (dateChange)="onDateChange($event.value)" formControlName="date">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!--- Note that these columns can be defined in any order.
                  The actual rendered columns are set as a property on the row definition" -->

      <!-- firstName Column -->
       <ng-container matColumnDef="mainUniqueTaskNo">
        <th mat-header-cell *matHeaderCellDef>Main Task No</th>
        <td mat-cell *matCellDef="let element">{{ element.mainUniqueTaskNo }}</td>
      </ng-container>

      <ng-container matColumnDef="uniqueSubTaskNo">
        <th mat-header-cell *matHeaderCellDef>SUb Task No</th>
        <td mat-cell *matCellDef="let element">{{ element.uniqueSubTaskNo }}</td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef>Customer</th>
        <td mat-cell *matCellDef="let element">{{ element.customer }}</td>
      </ng-container>

      <ng-container matColumnDef="assignUserName">
        <th mat-header-cell *matHeaderCellDef>Assignee</th>
        <td mat-cell *matCellDef="let element">{{ element.assignUserName }}</td>
      </ng-container>

      <!-- lastName Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>

      <!-- age Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <mat-form-field class="status-select">
                <mat-select 
                  [value]="element.status" 
                  (selectionChange)="updateStatus(element.id, $event.value)"
                  [panelClass]="'status-panel'">
                  <mat-option 
                    *ngFor="let option of statusOptions" 
                    [value]="option.value"
                    [class]="'status-option-' + option.value">
                    <mat-chip [style.backgroundColor]="option.color" class="status-chip">
                      {{ option.label }}
                    </mat-chip>
                  </mat-option>
                </mat-select>
              </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button
            class="btnUpdate"
            (click)="changeSubTaskStatus(element)"
          >
          Update Status
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator>
  </div>
