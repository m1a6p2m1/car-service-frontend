<div class="container">
    <div class="form-section">
      <form
        [formGroup]="additionalServicesForm"
        class="example-form"
        (ngSubmit)="onSubmit()"
      >

        <mat-form-field class="example-full-width">
            <mat-label>Additional Services Name</mat-label>
            <input matInput formControlName="additionalServicesName" />
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Service Price</mat-label>
            <input
                matInput
                formControlName="additionalServicePrice"
                placeholder="Rs."
            />
        </mat-form-field>

        <mat-radio-group aria-label="Select an option" formControlName="status">
        <mat-label class="recommendation-label">Do You Want to Show this Service in the System ?</mat-label><br><br>
          <mat-radio-button value="Yes">Yes</mat-radio-button>
          <mat-radio-button value="No">No</mat-radio-button>
        </mat-radio-group><br><br>

        <!-- <mat-radio-group aria-label="Select an option" formControlName="gender">
        <mat-label class="gender-label">Gender</mat-label>
        <mat-radio-button value="male">Male</mat-radio-button>
        <mat-radio-button value="female">Female</mat-radio-button>
      </mat-radio-group><br><br> -->


        <button
          type="submit"
          mat-raised-button
          color="primary"
          class="form-button"
          [disabled]="isButtonDisable"
        >
          {{ saveButtonLabel }}
        </button>
        <!--[disabled]="isButtonDisable" -->
        <button
          type="button"
          mat-raised-button
          color="secondary"
          (click)="resetData()"
        >
          Reset
        </button>
  
      </form>
    </div>

    <div class="table-section">
        <div class="refresh-button-filter-section">
          <div class="refresh-button">
            <button mat-icon-button color="primary" (click)="refreshData()">
              <mat-icon>refresh</mat-icon>
            </button>
          </div>
          <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
          </mat-form-field>
        </div>
    
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8"><!--[dataSource]="dataSource"-->
          <ng-container matColumnDef="additionalServicesName">
            <th mat-header-cell *matHeaderCellDef>Additional Services Name</th>
            <td mat-cell *matCellDef="let element">{{ element.additionalServicesName }}</td>
          </ng-container>

          <ng-container matColumnDef="additionalServicePrice">
            <th mat-header-cell *matHeaderCellDef>Service Price</th>
            <td mat-cell *matCellDef="let element">{{ element.additionalServicePrice }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">{{ element.status }}</td>
          </ng-container>
    
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let row"> 
              <button mat-icon-button color="warn" (click)="editData(row)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
    
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page of users"
        ></mat-paginator>
      </div>
</div>
