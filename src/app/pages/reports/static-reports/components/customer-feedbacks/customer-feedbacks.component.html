<div class="progress-charts">
      <div class="header">
        <h2>Customer Feedbacks</h2>
        <p>Namal Car Service</p>
      </div>

      <div class="charts-grid">

        <div class="chart-card">
          <h3>Customer Feedback Ratings</h3>
          <apx-chart
            [series]="commonTaskGroupChartOptions.series"
            [chart]="commonTaskGroupChartOptions.chart"
            [labels]="commonTaskGroupChartOptions.labels"
            [colors]="commonTaskGroupChartOptions.colors"
            [legend]="commonTaskGroupChartOptions.legend"
            [plotOptions]="commonTaskGroupChartOptions.plotOptions"
            [title]="commonTaskGroupChartOptions.title"
          ></apx-chart>
        </div>
      </div>
    </div>
