<div class="progress-charts">
      <div class="header">
        <h2>Business Stats</h2>
        <p>Namal Car Service</p>
      </div>

      <div class="charts-grid">

        <div class="chart-card">
          <h3>Employee Count Stat</h3>
          <apx-chart
            [series]="volumeChartOptions.series"
            [chart]="volumeChartOptions.chart"
            [xaxis]="volumeChartOptions.xaxis"
            [yaxis]="volumeChartOptions.yaxis"
            [colors]="volumeChartOptions.colors"
            [plotOptions]="volumeChartOptions.plotOptions"
            [grid]="volumeChartOptions.grid"
            [title]="volumeChartOptions.title"
          ></apx-chart>
        </div>

        <div class="chart-card">
          <h3>Services Distribution Stat</h3>
          <apx-chart
            [series]="commonTaskGroupChartOptions.series"
            [chart]="commonTaskGroupChartOptions.chart"
            [labels]="commonTaskGroupChartOptions.labels"
            [colors]="commonTaskGroupChartOptions.colors"
            [legend]="commonTaskGroupChartOptions.legend"
            [plotOptions]="commonTaskGroupChartOptions.plotOptions"
            [title]="commonTaskGroupChartOptions.title"
          ></apx-chart>
        </div>
      </div>
    </div>
