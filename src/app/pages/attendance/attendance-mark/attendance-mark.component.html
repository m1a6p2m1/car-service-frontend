    <div class="table-section">
      
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->
      
        <!-- Position Column -->
        <ng-container matColumnDef="empId">
          <th mat-header-cell *matHeaderCellDef> Employee Id </th>
          <td mat-cell *matCellDef="let element"> {{element.employeeId}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="employeeName">
          <th mat-header-cell *matHeaderCellDef> Employee Name </th>
          <td mat-cell *matCellDef="let element"> {{element.employeeName}} </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element"> {{element.date | date:'yyyy-MM-dd'}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element" let i = "index"> 
            <mat-form-field class="attendance">
                <mat-label>Attendance</mat-label>
                <mat-select [(ngModel)]="element.attendanceStatus" 
                  name="attendanceStatus{{i}}" 
                  [disabled]="isAttendanceSavedToday">
                    <mat-option value="PRESENT">Present</mat-option>
                    <mat-option value="ABSENT">Absent</mat-option>
                </mat-select>
            </mat-form-field>
          </td>
        </ng-container> 
        <!-- [disabled]="isAttendanceSavedToday" -->

        <!-- <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element"> 
            <button mat-icon-button color="warn" (click)="enableEdit()" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container> -->
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>  
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>    
    </div>
    
  </div>

  <div class="container w-100 m-3">
  <div class="btn-group w-100" role="group">
    <button type="submit" mat-raised-button color="primary" class="btnSave" [disabled]="isButtonDisable" (click)="saveData()">
      {{ saveButtonLabel  }}
    </button>
    <button mat-raised-button color="accent" class="btnEdit" (click)="enableEdit()" [disabled]="mode !== 'view'">
      Edit Attendance
    </button>
  </div>
</div>
