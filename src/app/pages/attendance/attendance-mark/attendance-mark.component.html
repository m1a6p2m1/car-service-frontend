<div class="container">
    <div class="form-section">
      <form [formGroup]="attendanceMarkForm" class="example-form" (ngSubmit)="onSubmit()">

        <mat-form-field class="example-full-width">
          <mat-label>Employee Id</mat-label>
          <input matInput formControlName="empId">
        </mat-form-field>

        <mat-form-field class="example-full-width">
            <mat-label>Employee Name</mat-label>
            <input matInput formControlName="employeeName">
        </mat-form-field>

        <!-- <button [disabled]="fileButtonDisable" type="button" mat-raised-button (click)="fileInput.click()" class="mb-2">Choose File</button> -->
        <div>
          <img [src]="selectedImageUrl ? selectedImageUrl : 'assets/images/item/uploadicon.png'" width="100px" height="100px" />
        </div>
        <input hidden (change)="onFileSelected($event)" #fileInput type="file" id="file" />
        <span class="text-danger" *ngIf="submitted && formControl['image'].errors && formControl['image'].errors['required']">
          Image is required
        </span>
        <br />


        <mat-form-field appearance="fill">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let status of statuses" [value]="status.value">
              {{status.viewValue}}
            </mat-option>
          </mat-select>
          <span class="text-danger" *ngIf="(attendanceMarkForm.get('status')?.touched || submitted) && attendanceMarkForm.get('status')?.errors && attendanceMarkForm.get('status')?.errors!['required']">
            Status is Required....!
          </span>
      </mat-form-field>

      <button type="submit" mat-raised-button color="primary" [disabled]="isButtonDisable" class="form-button">Save</button>  <!-- -->
      <button type="reset" mat-raised-button color="secondary" (click)="resetData()">Reset</button> 
      
      </form>
    </div>
    <div class="table-section">

      <div class="refresh-button-filter-section">
        <div class="refresh-button">
          <button mat-icon-button color="primary" (click)="refreshData()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
        <mat-form-field>
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
        </mat-form-field>
      </div>
      
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->
      
        <!-- Position Column -->
        <ng-container matColumnDef="empId">
          <th mat-header-cell *matHeaderCellDef> Employee Id </th>
          <td mat-cell *matCellDef="let element"> {{element.empId}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="employeeName">
          <th mat-header-cell *matHeaderCellDef> Employee Name </th>
          <td mat-cell *matCellDef="let element"> {{element.employeeName}} </td>
        </ng-container>
      
        <!-- Weight Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> {{element.status}} </td>
        </ng-container>
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>  
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>    
    </div>
  </div>
