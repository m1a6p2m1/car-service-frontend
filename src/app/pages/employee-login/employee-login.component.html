<div class="container">
    <div class="form-section">
      <form [formGroup]="employeeLoginForm" class="example-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
            <mat-label>Employee</mat-label>
            <mat-select formControlName="employee">
              <mat-option *ngFor="let employee of employees" [value]="employee.id">
                {{ employee.name }}
              </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>First Name</mat-label>
          <input matInput placeholder="First Name" formControlName="firstName" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Last Name</mat-label>
          <input matInput placeholder="Last Name" formControlName="lastName" />
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>User Name</mat-label>
            <input matInput placeholder="Last Name" formControlName="userName" />
          </mat-form-field>

        <div class="example-container">
          <mat-form-field>
            <mat-label>Enter your password</mat-label>
            <input formControlName="password" matInput [type]="hide() ? 'password' : 'text'" />
            <button
              mat-icon-button
              matSuffix
              (click)="clickEvent($event)"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()"
              type="button"
            >
              <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>
        </div>
        <br /><br />
  
        <button
          type="submit"
          mat-raised-button
          color="primary"
          class="form-button"
          [disabled]="isButtonDisabled"
        >
          {{ saveButtonLabel }}
        </button>
        <button
          type="reset"
          mat-raised-button
          color="secondary"
          (click)="resetData()"
        >
          Reset
        </button>
      </form>
    </div>
    <div class="table-section">
        <div class="refresh-button">
            <button mat-icon-button color="primary" (click)="refreshData()">
              <mat-icon>refresh</mat-icon>
            </button>
          </div>
    
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          
          <ng-container matColumnDef="employee">
            <th mat-header-cell *matHeaderCellDef>Employee</th>
            <td mat-cell *matCellDef="let element">{{ element.employee }}</td>
          </ng-container>
    
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef>First Name</th>
            <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
          </ng-container>
    
          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef>Last Name</th>
            <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
          </ng-container>
    
          <ng-container matColumnDef="userName">
              <th mat-header-cell *matHeaderCellDef> User Name </th>
              <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
          </ng-container>

          <ng-container matColumnDef="password">
            <th mat-header-cell *matHeaderCellDef> Password </th>
            <td mat-cell *matCellDef="let element"> {{element.password}} </td>
        </ng-container>
    
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element">
              <button
                mat-icon-button
                color="warn"
                (click)="editData(element)"
                matTooltip="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <!-- <button
                mat-icon-button
                color="warn"
                (click)="deleteData(element)"
                matTooltip="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button> -->
            </td>
          </ng-container>
    
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page of users"
        ></mat-paginator>
      </div>
</div>
